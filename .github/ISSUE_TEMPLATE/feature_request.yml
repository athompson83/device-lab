name: 💡 Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the testing workflow pain point, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How might it work? Remember the project constraints — dependency-light, vanilla JS frontend.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android lane (emulator/adb)
        - iOS lane
        - Projects & builds
        - Bug tracker & export
        - UI
        - Other
    validations:
      required: true
